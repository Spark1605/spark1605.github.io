<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRK | Studio Whiteboard Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        
        canvas { touch-action: none; }
        
        .active-tool {
            background-color: #6366f1 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .tool-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tool-btn:hover:not(.active-tool) {
            background-color: rgba(51, 65, 85, 0.6);
            color: #ffffff;
        }

        .sticky-note-input {
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-weight: 500;
            width: 100%;
            height: 100%;
            color: #0f172a;
        }
    </style>
</head>
<body class="bg-slate-950 h-screen w-screen overflow-hidden flex flex-col font-sans text-slate-200 select-none">

    <header class="h-14 border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md px-4 flex items-center justify-between shrink-0 z-30 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="flex items-center text-lg font-black uppercase tracking-wider">
                <span class="bg-gradient-to-r from-cyan-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">Sprk</span>
                <span class="text-white font-light ml-1">Board</span>
            </div>
            <span class="text-[10px] font-semibold px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded-full border border-indigo-500/30 hidden sm:inline-block">v2.5 Pro Engine</span>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2">
            <button id="undo-btn" class="p-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition disabled:opacity-30 disabled:pointer-events-none" title="Undo (Ctrl+Z)">
                <i data-lucide="undo-2" class="w-4 h-4"></i>
            </button>
            <button id="redo-btn" class="p-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition disabled:opacity-30 disabled:pointer-events-none" title="Redo (Ctrl+Y)">
                <i data-lucide="redo-2" class="w-4 h-4"></i>
            </button>
            <div class="h-4 w-[1px] bg-slate-800 mx-1"></div>
            <button id="delete-selected-btn" class="p-2 rounded-lg text-amber-400 hover:bg-amber-950/40 transition disabled:opacity-30 disabled:pointer-events-none" title="Delete Selection (Del)">
                <i data-lucide="trash" class="w-4 h-4"></i>
            </button>
            <button id="clear-btn" class="p-2 rounded-lg text-rose-400 hover:bg-rose-950/40 transition" title="Clear Canvas">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
            <div class="h-4 w-[1px] bg-slate-800 mx-1"></div>
            <button id="export-btn" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition active:scale-95 shadow-md">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Export PNG</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">

        <aside id="desktop-sidebar" class="hidden md:flex absolute left-4 top-4 bottom-4 z-30 w-14 bg-slate-900/90 backdrop-blur-md border border-slate-800/80 rounded-2xl p-2 flex-col items-center justify-between shadow-2xl">
            <div class="flex flex-col gap-1.5 w-full">
                <button id="tool-select" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Select & Move (V)">
                    <i data-lucide="mouse-pointer" class="w-4 h-4"></i>
                </button>
                <button id="tool-pan" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Pan Canvas (Space+Drag)">
                    <i data-lucide="hand" class="w-4 h-4"></i>
                </button>
                <button id="tool-laser" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Laser Pointer (L)">
                    <i data-lucide="pointer" class="w-4 h-4"></i>
                </button>
                
                <div class="h-[1px] bg-slate-800 my-1"></div>

                <button id="tool-pen" class="tool-btn active-tool p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Pen Tool (P)">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
                <button id="tool-highlighter" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Highlighter (H)">
                    <i data-lucide="highlighter" class="w-4 h-4"></i>
                </button>
                <button id="tool-eraser" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Eraser Tool (E)">
                    <i data-lucide="eraser" class="w-4 h-4"></i>
                </button>

                <div class="h-[1px] bg-slate-800 my-1"></div>

                <button id="tool-text" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Text Note (T)">
                    <i data-lucide="type" class="w-4 h-4"></i>
                </button>
                <button id="tool-sticky" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Sticky Note (S)">
                    <i data-lucide="sticky-note" class="w-4 h-4"></i>
                </button>

                <div class="h-[1px] bg-slate-800 my-1"></div>

                <button id="tool-line" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Straight Line">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                </button>
                <button id="tool-arrow" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Arrow">
                    <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                </button>
                <button id="tool-rect" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Rectangle">
                    <i data-lucide="square" class="w-4 h-4"></i>
                </button>
                <button id="tool-circle" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Circle">
                    <i data-lucide="circle" class="w-4 h-4"></i>
                </button>
            </div>

            <button id="theme-btn" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Toggle Board Theme">
                <i data-lucide="sun" class="w-4 h-4"></i>
            </button>
        </aside>

        <main class="flex-1 h-full w-full relative bg-slate-950 overflow-hidden" id="canvas-container">
            <canvas id="whiteboard" class="absolute inset-0 cursor-crosshair z-10"></canvas>
            <div id="html-overlay" class="absolute inset-0 pointer-events-none z-20"></div>
        </main>

        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-30 bg-slate-900/90 backdrop-blur-md border border-slate-800/80 rounded-2xl px-4 py-2 flex items-center gap-4 shadow-2xl text-xs max-w-[95vw] overflow-x-auto custom-scrollbar">
            
            <div class="flex md:hidden items-center gap-1 shrink-0 border-r border-slate-800 pr-3">
                <button class="m-tool-btn active-tool p-2 rounded-lg" data-tool="pen"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                <button class="m-tool-btn p-2 rounded-lg text-slate-400" data-tool="eraser"><i data-lucide="eraser" class="w-4 h-4"></i></button>
                <button class="m-tool-btn p-2 rounded-lg text-slate-400" data-tool="select"><i data-lucide="mouse-pointer" class="w-4 h-4"></i></button>
                <button class="m-tool-btn p-2 rounded-lg text-slate-400" data-tool="sticky"><i data-lucide="sticky-note" class="w-4 h-4"></i></button>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <input type="color" id="wb-color" value="#ffffff" class="w-7 h-7 rounded-lg cursor-pointer bg-transparent border-0 p-0">
                <div class="flex gap-1.5">
                    <button class="w-5 h-5 rounded-full bg-white border border-slate-600 color-preset" data-color="#ffffff"></button>
                    <button class="w-5 h-5 rounded-full bg-slate-900 border border-slate-600 color-preset" data-color="#0f172a"></button>
                    <button class="w-5 h-5 rounded-full bg-rose-500 color-preset" data-color="#f43f5e"></button>
                    <button class="w-5 h-5 rounded-full bg-sky-500 color-preset" data-color="#0284c7"></button>
                    <button class="w-5 h-5 rounded-full bg-emerald-500 color-preset" data-color="#10b981"></button>
                    <button class="w-5 h-5 rounded-full bg-amber-400 color-preset" data-color="#fbbf24"></button>
                </div>
            </div>

            <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>

            <div class="flex items-center gap-2 shrink-0">
                <i data-lucide="circle-dot" class="w-3.5 h-3.5 text-slate-400"></i>
                <input type="range" id="wb-size" min="1" max="30" value="3" class="w-16 sm:w-24 accent-indigo-500 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                <span id="size-preview" class="text-[11px] font-mono text-slate-400 w-6">3px</span>
            </div>

            <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>

            <div class="flex items-center gap-1.5 shrink-0">
                <i data-lucide="grid" class="w-3.5 h-3.5 text-slate-400"></i>
                <select id="grid-pattern-select" class="bg-slate-800 text-slate-200 text-xs px-2 py-1 rounded-lg border border-slate-700 focus:outline-none cursor-pointer">
                    <option value="none">Blank</option>
                    <option value="grid" selected>Grid</option>
                    <option value="dots">Dots</option>
                    <option value="lined">Lined</option>
                </select>
            </div>
            
            <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>

            <div class="flex items-center gap-1 shrink-0">
                <button id="zoom-out-btn" class="p-1 rounded text-slate-400 hover:text-white" title="Zoom Out"><i data-lucide="zoom-out" class="w-3.5 h-3.5"></i></button>
                <span id="zoom-level" class="text-[11px] font-mono text-slate-400 min-w-[36px] text-center">100%</span>
                <button id="zoom-in-btn" class="p-1 rounded text-slate-400 hover:text-white" title="Zoom In"><i data-lucide="zoom-in" class="w-3.5 h-3.5"></i></button>
                <button id="zoom-reset-btn" class="p-1 px-1.5 rounded bg-slate-800 text-slate-400 hover:text-white text-[10px] font-mono font-semibold" title="Reset View">1:1</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Canvas & DOM Container Initialization
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        const htmlOverlay = document.getElementById('html-overlay');

        // UI Controls
        const colorPicker = document.getElementById('wb-color');
        const sizePicker = document.getElementById('wb-size');
        const sizePreview = document.getElementById('size-preview');
        const gridSelect = document.getElementById('grid-pattern-select');
        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');
        const deleteSelectedBtn = document.getElementById('delete-selected-btn');
        const themeBtn = document.getElementById('theme-btn');

        // Engine State
        let activeTool = 'pen';
        let strokeColor = '#ffffff';
        let strokeWidth = 3;
        let activeGridPattern = 'grid';
        let isDarkModeBoard = true;
        
        // Canvas Transformation Engine
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let isSpacePressed = false;
        let startPanX = 0, startPanY = 0;

        // Interactive States
        let isDrawing = false;
        let currentPath = [];
        let selectedElementIndex = -1;
        let isDraggingElement = false;
        let dragOffset = { x: 0, y: 0 };

        // Laser Engine
        let laserTrail = [];

        // Data Management Stack
        let elements = [];
        let undoStack = [];
        let redoStack = [];

        // Touch Interaction State
        let initialPinchDist = null;

        function resizeCanvas() {
            canvas.width = canvasContainer.clientWidth;
            canvas.height = canvasContainer.clientHeight;
            requestRender();
        }

        function pushState() {
            undoStack.push(JSON.stringify(elements));
            if (undoStack.length > 50) undoStack.shift();
            redoStack = [];
            updateUndoRedoUI();
        }

        function updateUndoRedoUI() {
            undoBtn.disabled = undoStack.length === 0;
            redoBtn.disabled = redoStack.length === 0;
            deleteSelectedBtn.disabled = selectedElementIndex === -1;
        }

        // World to Screen Coordinate Translators
        function screenToWorld(sx, sy) {
            return { x: (sx - panX) / scale, y: (sy - panY) / scale };
        }

        function worldToScreen(wx, wy) {
            return { x: wx * scale + panX, y: wy * scale + panY };
        }

        function getEventCoords(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                screenX: clientX - rect.left,
                screenY: clientY - rect.top,
                world: screenToWorld(clientX - rect.left, clientY - rect.top)
            };
        }

        let renderRequested = false;
        function requestRender() {
            if (!renderRequested) {
                renderRequested = true;
                requestAnimationFrame(render);
            }
        }

        function renderGrid() {
            ctx.fillStyle = isDarkModeBoard ? '#090d16' : '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (activeGridPattern === 'none') return;

            ctx.save();
            ctx.strokeStyle = isDarkModeBoard ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';
            ctx.fillStyle = isDarkModeBoard ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 1;

            const step = 32 * scale;
            const offsetX = panX % step;
            const offsetY = panY % step;

            if (activeGridPattern === 'grid') {
                ctx.beginPath();
                for (let x = offsetX; x < canvas.width; x += step) {
                    ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
                }
                for (let y = offsetY; y < canvas.height; y += step) {
                    ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
                }
                ctx.stroke();
            } else if (activeGridPattern === 'lined') {
                ctx.beginPath();
                for (let y = offsetY; y < canvas.height; y += step) {
                    ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
                }
                ctx.stroke();
            } else if (activeGridPattern === 'dots') {
                for (let x = offsetX; x < canvas.width; x += step) {
                    for (let y = offsetY; y < canvas.height; y += step) {
                        ctx.beginPath();
                        ctx.arc(x, y, 1.2 * Math.min(scale, 1.2), 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
            ctx.restore();
        }

        function render() {
            renderRequested = false;
            renderGrid();

            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            elements.forEach((el, index) => {
                drawElement(el, index === selectedElementIndex);
            });

            if (isDrawing && currentPath.length > 0) {
                const previewEl = createActiveElement();
                if (previewEl) drawElement(previewEl, false);
            }

            if (laserTrail.length > 0) {
                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                for (let i = 1; i < laserTrail.length; i++) {
                    const pt1 = laserTrail[i - 1];
                    const pt2 = laserTrail[i];
                    ctx.strokeStyle = `rgba(244, 63, 94, ${pt2.alpha})`;
                    ctx.lineWidth = 4 / scale;
                    ctx.beginPath();
                    ctx.moveTo(pt1.x, pt1.y);
                    ctx.lineTo(pt2.x, pt2.y);
                    ctx.stroke();
                }
                ctx.restore();
            }

            ctx.restore();
            renderHTMLOverlay();
        }

        function drawElement(el, isSelected) {
            ctx.save();
            ctx.strokeStyle = el.color;
            ctx.fillStyle = el.color;
            ctx.lineWidth = el.size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (el.type === 'highlighter') {
                ctx.globalAlpha = 0.35;
                ctx.lineWidth = el.size * 3.5;
            }

            ctx.beginPath();

            if (['pen', 'highlighter', 'eraser'].includes(el.type)) {
                if (el.type === 'eraser') {
                    ctx.strokeStyle = isDarkModeBoard ? '#090d16' : '#f8fafc';
                    ctx.lineWidth = el.size * 4;
                }
                if (el.points.length > 0) {
                    ctx.moveTo(el.points[0].x, el.points[0].y);
                    for (let i = 1; i < el.points.length; i++) {
                        ctx.lineTo(el.points[i].x, el.points[i].y);
                    }
                    ctx.stroke();
                }
            } else if (el.type === 'line') {
                ctx.moveTo(el.x1, el.y1); ctx.lineTo(el.x2, el.y2); ctx.stroke();
            } else if (el.type === 'arrow') {
                const headlen = 12;
                const angle = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
                ctx.moveTo(el.x1, el.y1); ctx.lineTo(el.x2, el.y2); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(el.x2, el.y2);
                ctx.lineTo(el.x2 - headlen * Math.cos(angle - Math.PI / 6), el.y2 - headlen * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(el.x2 - headlen * Math.cos(angle + Math.PI / 6), el.y2 - headlen * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fill();
            } else if (el.type === 'rect') {
                ctx.strokeRect(el.x, el.y, el.w, el.h);
            } else if (el.type === 'circle') {
                ctx.beginPath();
                ctx.arc(el.x + el.w / 2, el.y + el.h / 2, Math.abs(Math.max(el.w, el.h)) / 2, 0, Math.PI * 2);
                ctx.stroke();
            } else if (el.type === 'text') {
                ctx.font = `${Math.max(16, el.size * 3)}px sans-serif`;
                ctx.fillText(el.text || 'Text', el.x, el.y);
            }

            if (isSelected) {
                const b = getElementBounds(el);
                ctx.save();
                ctx.strokeStyle = '#6366f1';
                ctx.lineWidth = 1.5 / scale;
                ctx.setLineDash([4 / scale, 4 / scale]);
                ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
                ctx.restore();
            }

            ctx.restore();
        }

        function getElementBounds(el) {
            if (['pen', 'highlighter', 'eraser'].includes(el.type)) {
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                el.points.forEach(p => {
                    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
                    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
                });
                return { x: minX, y: minY, w: maxX - minX || 10, h: maxY - minY || 10 };
            } else if (['line', 'arrow'].includes(el.type)) {
                return {
                    x: Math.min(el.x1, el.x2), y: Math.min(el.y1, el.y2),
                    w: Math.abs(el.x2 - el.x1) || 10, h: Math.abs(el.y2 - el.y1) || 10
                };
            } else if (['rect', 'circle', 'sticky'].includes(el.type)) {
                return { x: el.x, y: el.y, w: el.w, h: el.h };
            } else if (el.type === 'text') {
                return { x: el.x, y: el.y - 18, w: (el.text.length || 4) * 10, h: 22 };
            }
            return { x: 0, y: 0, w: 0, h: 0 };
        }

        function renderHTMLOverlay() {
            htmlOverlay.innerHTML = '';
            elements.forEach((el, index) => {
                if (el.type === 'sticky') {
                    const screenPos = worldToScreen(el.x, el.y);
                    const card = document.createElement('div');
                    card.className = 'absolute rounded-xl p-2.5 shadow-xl border flex flex-col pointer-events-auto transition-transform';
                    card.style.left = `${screenPos.x}px`;
                    card.style.top = `${screenPos.y}px`;
                    card.style.width = `${el.w * scale}px`;
                    card.style.height = `${el.h * scale}px`;
                    card.style.backgroundColor = el.color;
                    card.style.borderColor = 'rgba(0,0,0,0.08)';

                    const textarea = document.createElement('textarea');
                    textarea.className = 'sticky-note-input custom-scrollbar';
                    textarea.style.fontSize = `${Math.max(12, 14 * scale)}px`;
                    textarea.value = el.text || '';
                    textarea.placeholder = 'Type note...';
                    
                    textarea.addEventListener('input', (e) => { el.text = e.target.value; });
                    textarea.addEventListener('focus', () => { selectedElementIndex = index; requestRender(); });

                    card.appendChild(textarea);
                    htmlOverlay.appendChild(card);
                }
            });
        }

        function createActiveElement() {
            if (currentPath.length === 0) return null;
            const p1 = currentPath[0];
            const p2 = currentPath[currentPath.length - 1];

            if (['pen', 'highlighter', 'eraser'].includes(activeTool)) {
                return { type: activeTool, points: [...currentPath], color: strokeColor, size: strokeWidth };
            } else if (activeTool === 'line') {
                return { type: 'line', x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, color: strokeColor, size: strokeWidth };
            } else if (activeTool === 'arrow') {
                return { type: 'arrow', x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, color: strokeColor, size: strokeWidth };
            } else if (['rect', 'circle'].includes(activeTool)) {
                return { 
                    type: activeTool, 
                    x: Math.min(p1.x, p2.x), 
                    y: Math.min(p1.y, p2.y), 
                    w: Math.abs(p2.x - p1.x), 
                    h: Math.abs(p2.y - p1.y), 
                    color: strokeColor, 
                    size: strokeWidth 
                };
            }
            return null;
        }

        function hitTest(worldPt) {
            for (let i = elements.length - 1; i >= 0; i--) {
                const b = getElementBounds(elements[i]);
                if (worldPt.x >= b.x && worldPt.x <= b.x + b.w && worldPt.y >= b.y && worldPt.y <= b.y + b.h) {
                    return i;
                }
            }
            return -1;
        }

        function handlePointerStart(e) {
            if (e.touches && e.touches.length === 2) {
                isDrawing = false;
                isPanning = true;
                initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                return;
            }

            const { screenX, screenY, world } = getEventCoords(e);

            if (activeTool === 'pan' || isSpacePressed || e.button === 1) {
                isPanning = true;
                startPanX = screenX - panX;
                startPanY = screenY - panY;
                return;
            }

            if (activeTool === 'select') {
                const hitIndex = hitTest(world);
                selectedElementIndex = hitIndex;
                if (hitIndex !== -1) {
                    isDraggingElement = true;
                    const b = getElementBounds(elements[hitIndex]);
                    dragOffset = { x: world.x - b.x, y: world.y - b.y };
                }
                updateUndoRedoUI();
                requestRender();
                return;
            }

            if (activeTool === 'laser') {
                isDrawing = true;
                laserTrail.push({ x: world.x, y: world.y, alpha: 1 });
                requestRender();
                return;
            }

            if (activeTool === 'text') {
                pushState();
                const textVal = prompt('Enter Text Note:', 'Text');
                if (textVal) {
                    elements.push({ type: 'text', x: world.x, y: world.y, text: textVal, color: strokeColor, size: strokeWidth });
                }
                requestRender();
                return;
            }

            if (activeTool === 'sticky') {
                pushState();
                elements.push({ type: 'sticky', x: world.x, y: world.y, w: 160, h: 140, text: '', color: '#fef08a' });
                requestRender();
                return;
            }

            isDrawing = true;
            currentPath = [world];
        }

        function handlePointerMove(e) {
            if (e.touches && e.touches.length === 2 && isPanning) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if (initialPinchDist) {
                    zoomAtPoint(scale * (dist / initialPinchDist), canvas.width / 2, canvas.height / 2);
                    initialPinchDist = dist;
                }
                return;
            }

            const { screenX, screenY, world } = getEventCoords(e);

            if (isPanning) {
                panX = screenX - startPanX;
                panY = screenY - startPanY;
                requestRender();
                return;
            }

            if (isDraggingElement && selectedElementIndex !== -1) {
                const el = elements[selectedElementIndex];
                const dx = world.x - dragOffset.x;
                const dy = world.y - dragOffset.y;

                if (['rect', 'circle', 'text', 'sticky'].includes(el.type)) {
                    el.x = dx; el.y = dy;
                } else if (['line', 'arrow'].includes(el.type)) {
                    const w = el.x2 - el.x1; const h = el.y2 - el.y1;
                    el.x1 = dx; el.y1 = dy; el.x2 = dx + w; el.y2 = dy + h;
                }
                requestRender();
                return;
            }

            if (!isDrawing) return;

            if (activeTool === 'laser') {
                laserTrail.push({ x: world.x, y: world.y, alpha: 1 });
                if (laserTrail.length > 20) laserTrail.shift();
                requestRender();
                return;
            }

            currentPath.push(world);
            requestRender();
        }

        function handlePointerEnd() {
            if (isPanning) {
                isPanning = false;
                initialPinchDist = null;
                return;
            }

            if (isDraggingElement) {
                isDraggingElement = false;
                pushState();
                return;
            }

            if (!isDrawing) return;
            isDrawing = false;

            if (activeTool === 'laser') {
                const fadeInterval = setInterval(() => {
                    laserTrail.forEach(pt => pt.alpha -= 0.15);
                    laserTrail = laserTrail.filter(pt => pt.alpha > 0);
                    requestRender();
                    if (laserTrail.length === 0) clearInterval(fadeInterval);
                }, 30);
                return;
            }

            const newEl = createActiveElement();
            if (newEl) {
                pushState();
                elements.push(newEl);
            }

            currentPath = [];
            requestRender();
        }

        function zoomAtPoint(newScale, sx, sy) {
            const clampedScale = Math.min(Math.max(0.2, newScale), 5);
            const world = screenToWorld(sx, sy);
            scale = clampedScale;
            panX = sx - world.x * scale;
            panY = sy - world.y * scale;

            document.getElementById('zoom-level').textContent = `${Math.round(scale * 100)}%`;
            requestRender();
        }

        // Attach Canvas Interaction Events
        canvas.addEventListener('mousedown', handlePointerStart);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerEnd);

        canvas.addEventListener('touchstart', (e) => handlePointerStart(e), { passive: false });
        canvas.addEventListener('touchmove', (e) => handlePointerMove(e), { passive: false });
        window.addEventListener('touchend', handlePointerEnd);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.ctrlKey || e.metaKey) {
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                zoomAtPoint(scale * zoomFactor, e.clientX, e.clientY);
            } else {
                panX -= e.deltaX;
                panY -= e.deltaY;
                requestRender();
            }
        }, { passive: false });

        // Tool Switching
        const toolsList = ['select', 'pan', 'laser', 'pen', 'highlighter', 'eraser', 'text', 'sticky', 'line', 'arrow', 'rect', 'circle'];
        
        function setTool(toolName) {
            activeTool = toolName;
            selectedElementIndex = -1;

            toolsList.forEach(t => {
                const b = document.getElementById(`tool-${t}`);
                if (b) {
                    if (t === toolName) b.classList.add('active-tool');
                    else b.classList.remove('active-tool');
                }
            });

            document.querySelectorAll('.m-tool-btn').forEach(btn => {
                if (btn.getAttribute('data-tool') === toolName) {
                    btn.classList.add('active-tool');
                } else {
                    btn.classList.remove('active-tool');
                }
            });

            canvas.style.cursor = toolName === 'pan' ? 'grab' : toolName === 'select' ? 'default' : 'crosshair';
            requestRender();
        }

        toolsList.forEach(t => {
            const btn = document.getElementById(`tool-${t}`);
            if (btn) btn.addEventListener('click', () => setTool(t));
        });

        document.querySelectorAll('.m-tool-btn').forEach(btn => {
            btn.addEventListener('click', () => setTool(btn.getAttribute('data-tool')));
        });

        // Theme Switch
        function toggleTheme() {
            isDarkModeBoard = !isDarkModeBoard;
            themeBtn.innerHTML = `<i data-lucide="${isDarkModeBoard ? 'sun' : 'moon'}" class="w-4 h-4"></i>`;

            if (!isDarkModeBoard && strokeColor === '#ffffff') {
                strokeColor = '#0f172a';
                colorPicker.value = '#0f172a';
            } else if (isDarkModeBoard && strokeColor === '#0f172a') {
                strokeColor = '#ffffff';
                colorPicker.value = '#ffffff';
            }

            lucide.createIcons();
            requestRender();
        }
        themeBtn.addEventListener('click', toggleTheme);

        // Zoom Toolbar
        document.getElementById('zoom-in-btn').addEventListener('click', () => zoomAtPoint(scale * 1.2, canvas.width / 2, canvas.height / 2));
        document.getElementById('zoom-out-btn').addEventListener('click', () => zoomAtPoint(scale / 1.2, canvas.width / 2, canvas.height / 2));
        document.getElementById('zoom-reset-btn').addEventListener('click', () => { panX = 0; panY = 0; zoomAtPoint(1, 0, 0); });

        // Color & Stroke Adjusters
        colorPicker.addEventListener('input', (e) => strokeColor = e.target.value);
        document.querySelectorAll('.color-preset').forEach(p => {
            p.addEventListener('click', () => {
                strokeColor = p.getAttribute('data-color');
                colorPicker.value = strokeColor;
            });
        });

        sizePicker.addEventListener('input', (e) => {
            strokeWidth = parseInt(e.target.value);
            sizePreview.textContent = `${strokeWidth}px`;
        });

        gridSelect.addEventListener('change', (e) => {
            activeGridPattern = e.target.value;
            requestRender();
        });

        // Stack History Options
        undoBtn.addEventListener('click', () => {
            if (undoStack.length > 0) {
                redoStack.push(JSON.stringify(elements));
                elements = JSON.parse(undoStack.pop());
                selectedElementIndex = -1;
                updateUndoRedoUI();
                requestRender();
            }
        });

        redoBtn.addEventListener('click', () => {
            if (redoStack.length > 0) {
                undoStack.push(JSON.stringify(elements));
                elements = JSON.parse(redoStack.pop());
                selectedElementIndex = -1;
                updateUndoRedoUI();
                requestRender();
            }
        });

        deleteSelectedBtn.addEventListener('click', () => {
            if (selectedElementIndex !== -1) {
                pushState();
                elements.splice(selectedElementIndex, 1);
                selectedElementIndex = -1;
                updateUndoRedoUI();
                requestRender();
            }
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('Clear entire canvas?')) {
                pushState();
                elements = [];
                selectedElementIndex = -1;
                requestRender();
            }
        });

        // Clean Image Exporter
        document.getElementById('export-btn').addEventListener('click', () => {
            const expCanvas = document.createElement('canvas');
            expCanvas.width = canvas.width;
            expCanvas.height = canvas.height;
            const expCtx = expCanvas.getContext('2d');

            expCtx.fillStyle = isDarkModeBoard ? '#090d16' : '#f8fafc';
            expCtx.fillRect(0, 0, expCanvas.width, expCanvas.height);
            expCtx.drawImage(canvas, 0, 0);

            const a = document.createElement('a');
            a.download = `sprk-whiteboard-${Date.now()}.png`;
            a.href = expCanvas.toDataURL('image/png');
            a.click();
        });

        // Keyboard Shortcut Mapping
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.code === 'Space') {
                isSpacePressed = true;
                canvas.style.cursor = 'grab';
            }
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); undoBtn.click(); }
                if (e.key === 'y' || e.key === 'Y') { e.preventDefault(); redoBtn.click(); }
            } else {
                if (e.key === 'v' || e.key === 'V') setTool('select');
                if (e.key === 'p' || e.key === 'P') setTool('pen');
                if (e.key === 'h' || e.key === 'H') setTool('highlighter');
                if (e.key === 'l' || e.key === 'L') setTool('laser');
                if (e.key === 'e' || e.key === 'E') setTool('eraser');
                if (e.key === 't' || e.key === 'T') setTool('text');
                if (e.key === 's' || e.key === 'S') setTool('sticky');
                if (e.key === 'Delete' || e.key === 'Backspace') deleteSelectedBtn.click();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                isSpacePressed = false;
                canvas.style.cursor = activeTool === 'pan' ? 'grab' : 'crosshair';
            }
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
