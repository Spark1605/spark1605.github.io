<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRK | Studio Whiteboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        canvas { touch-action: none; }
        
        .active-tool {
            background-color: #4f46e5 !important;
            color: #ffffff !important;
        }

        .tool-btn {
            transition: all 0.15s ease;
        }

        .tool-btn:hover:not(.active-tool) {
            background-color: #334155;
            color: #ffffff;
        }

        /* Mobile Floating Assistive Ball Animations */
        #assistive-ball {
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.5), 0 8px 10px -6px rgba(79, 70, 229, 0.5);
        }
        
        .drawer-open {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        
        .drawer-closed {
            transform: scale(0.85) translateY(20px);
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-950 h-screen w-screen overflow-hidden flex flex-col font-sans text-slate-200 select-none">

    <header class="h-12 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-3 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center gap-3">
            <div class="flex items-center text-base font-black uppercase tracking-wider">
                <span class="bg-gradient-to-r from-cyan-400 via-sky-400 to-purple-500 bg-clip-text text-transparent">Sprk</span>
                <span class="text-white font-light ml-0.5">-Board</span>
            </div>
            <span class="text-xs px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded border border-indigo-500/30 hidden sm:inline-block">Vector Canvas</span>
        </div>

        <div class="flex items-center gap-1.5">
            <button id="undo-btn" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition disabled:opacity-30" title="Undo (Ctrl+Z)">
                <i data-lucide="undo-2" class="w-4 h-4"></i>
            </button>
            <button id="redo-btn" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition disabled:opacity-30" title="Redo (Ctrl+Y)">
                <i data-lucide="redo-2" class="w-4 h-4"></i>
            </button>
            <div class="h-4 w-[1px] bg-slate-800 mx-1"></div>
            <button id="clear-btn" class="p-1.5 rounded-lg text-rose-400 hover:bg-rose-950/40 hover:text-rose-300 transition" title="Clear Canvas">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
            <button id="export-btn" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1.5 rounded-lg font-medium transition active:scale-95 shadow">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">Export PNG</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">

        <aside id="desktop-sidebar" class="hidden md:flex absolute left-3 top-3 bottom-3 z-10 w-14 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-1.5 flex-col items-center justify-between shadow-2xl">
            <div class="flex flex-col gap-1.5 w-full">
                <button id="tool-pan" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Pan Canvas (Hand)">
                    <i data-lucide="hand" class="w-4 h-4"></i>
                </button>
                
                <div class="h-[1px] bg-slate-800 my-0.5"></div>

                <button id="tool-pen" class="tool-btn active-tool p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Pen Tool">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
                <button id="tool-highlighter" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Highlighter">
                    <i data-lucide="highlighter" class="w-4 h-4"></i>
                </button>
                <button id="tool-auto-shape" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Smart Shape Detection">
                    <i data-lucide="sparkle" class="w-4 h-4"></i>
                </button>
                <button id="tool-eraser" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Vector Eraser">
                    <i data-lucide="eraser" class="w-4 h-4"></i>
                </button>

                <div class="h-[1px] bg-slate-800 my-0.5"></div>

                <button id="tool-line" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Straight Line">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                </button>
                <button id="tool-arrow" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Arrow">
                    <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                </button>
                <button id="tool-rect" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Rectangle">
                    <i data-lucide="square" class="w-4 h-4"></i>
                </button>
                <button id="tool-circle" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Circle">
                    <i data-lucide="circle" class="w-4 h-4"></i>
                </button>
                <button id="tool-ellipse" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Ellipse">
                    <i data-lucide="egg" class="w-4 h-4"></i>
                </button>
                <button id="tool-triangle" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Triangle">
                    <i data-lucide="triangle" class="w-4 h-4"></i>
                </button>
                <button id="tool-graph" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="2D Coordinate Axes Graph">
                    <i data-lucide="line-chart" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="flex flex-col gap-1.5 w-full">
                <button id="theme-btn" class="tool-btn p-2.5 rounded-lg text-slate-400 flex justify-center items-center" title="Toggle Board Canvas Theme">
                    <i data-lucide="sun" class="w-4 h-4"></i>
                </button>
            </div>
        </aside>

        <main class="flex-1 h-full w-full relative bg-slate-950 overflow-hidden" id="canvas-container">
            <canvas id="bg-layer" class="absolute inset-0 pointer-events-none z-0"></canvas>
            <canvas id="whiteboard" class="absolute inset-0 cursor-crosshair z-10"></canvas>
        </main>

        <div id="assistive-ball-container" class="md:hidden fixed bottom-16 right-4 z-40 flex flex-col items-end">
            <div id="mobile-drawer" class="drawer-closed transition-all duration-200 bg-slate-900/95 border border-slate-800 backdrop-blur rounded-2xl p-3 mb-3 shadow-2xl flex flex-col gap-3 w-64 max-h-[70vh] overflow-y-auto custom-scrollbar">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider pb-1 border-b border-slate-800">Drawing Tools</div>
                <div class="grid grid-cols-4 gap-1.5">
                    <button id="m-tool-pen" class="m-tool-btn p-2 rounded-lg bg-indigo-600 text-white flex justify-center items-center" data-tool="pen"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                    <button id="m-tool-highlighter" class="m-tool-btn p-2 rounded-lg bg-slate-800 text-slate-300 flex justify-center items-center" data-tool="highlighter"><i data-lucide="highlighter" class="w-4 h-4"></i></button>
                    <button id="m-tool-auto-shape" class="m-tool-btn p-2 rounded-lg bg-slate-800 text-slate-300 flex justify-center items-center" data-tool="auto-shape"><i data-lucide="sparkle" class="w-4 h-4"></i></button>
                    <button id="m-tool-eraser" class="m-tool-btn p-2 rounded-lg bg-slate-800 text-slate-300 flex justify-center items-center" data-tool="eraser"><i data-lucide="eraser" class="w-4 h-4"></i></button>
                    <button id="m-tool-pan" class="m-tool-btn p-2 rounded-lg bg-slate-800 text-slate-300 flex justify-center items-center" data-tool="pan"><i data-lucide="hand" class="w-4 h-4"></i></button>
                </div>

                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider pb-1 border-b border-slate-800">Shapes & Graphs</div>
                <div class="grid grid-cols-4 gap-1.5">
                    <button id="m-tool-line" class="m-tool-btn p-2 rounded-lg bg-slate-800 text-slate-300 flex justify-center items-center" data-tool="line"><i data-lucide="minus" class="w-4 h-4"></i></button>
                    <button id="m-tool-arrow" class="m-tool-btn p-2 rounded-lg bg-slate-800 text-slate-300 flex justify-center items-center" data-tool="arrow"><i data-lucide="arrow-up-right" class="w-4 h-4"></i></button>
                    <button id="m-tool-rect" class="m-tool-btn p-2 rounded-lg bg-slate-800 text-slate-300 flex justify-center items-center" data-tool="rect"><i data-lucide="square" class="w-4 h-4"></i></button>
                    <button id="m-tool-circle" class="m-tool-btn p-2 rounded-lg bg-slate-800 text-slate-300 flex justify-center items-center" data-tool="circle"><i data-lucide="circle" class="w-4 h-4"></i></button>
                    <button id="m-tool-ellipse" class="m-tool-btn p-2 rounded-lg bg-slate-800 text-slate-300 flex justify-center items-center" data-tool="ellipse"><i data-lucide="egg" class="w-4 h-4"></i></button>
                    <button id="m-tool-triangle" class="m-tool-btn p-2 rounded-lg bg-slate-800 text-slate-300 flex justify-center items-center" data-tool="triangle"><i data-lucide="triangle" class="w-4 h-4"></i></button>
                    <button id="m-tool-graph" class="m-tool-btn p-2 rounded-lg bg-slate-800 text-slate-300 flex justify-center items-center" data-tool="graph"><i data-lucide="line-chart" class="w-4 h-4"></i></button>
                </div>

                <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                    <span class="text-xs text-slate-400">Board Theme</span>
                    <button id="m-theme-btn" class="p-2 rounded-lg bg-slate-800 text-slate-300"><i data-lucide="sun" class="w-4 h-4"></i></button>
                </div>
            </div>

            <button id="assistive-ball" class="w-12 h-12 rounded-full bg-indigo-600 text-white flex items-center justify-center transition active:scale-90 z-50">
                <i data-lucide="pen-tool" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl px-3 sm:px-4 py-2 flex items-center gap-2 sm:gap-4 shadow-2xl text-xs max-w-[95vw] overflow-x-auto custom-scrollbar">
            <div class="flex items-center gap-1.5 shrink-0">
                <input type="color" id="wb-color" value="#ffffff" class="w-6 h-6 rounded cursor-pointer bg-transparent border-0">
                <div class="flex gap-1">
                    <button class="w-5 h-5 rounded-full bg-white border border-slate-600 color-preset" data-color="#ffffff"></button>
                    <button class="w-5 h-5 rounded-full bg-black border border-slate-600 color-preset" data-color="#000000"></button>
                    <button class="w-5 h-5 rounded-full bg-red-500 color-preset" data-color="#ef4444"></button>
                    <button class="w-5 h-5 rounded-full bg-blue-500 color-preset" data-color="#3b82f6"></button>
                    <button class="w-5 h-5 rounded-full bg-emerald-500 color-preset" data-color="#10b981"></button>
                    <button class="w-5 h-5 rounded-full bg-amber-400 color-preset" data-color="#f59e0b"></button>
                </div>
            </div>

            <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>

            <div class="flex items-center gap-2 shrink-0">
                <i data-lucide="circle-dot" class="w-3.5 h-3.5 text-slate-400"></i>
                <input type="range" id="wb-size" min="1" max="40" value="3" class="w-16 sm:w-20 accent-indigo-500 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                <span id="size-preview" class="text-[11px] text-slate-400 min-w-[22px]">3px</span>
            </div>

            <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>

            <div class="flex items-center gap-1.5 shrink-0">
                <i data-lucide="grid" class="w-3.5 h-3.5 text-slate-400"></i>
                <select id="grid-pattern-select" class="bg-slate-800 text-slate-200 text-xs px-2 py-1 rounded border border-slate-700 focus:outline-none cursor-pointer">
                    <option value="none">Blank</option>
                    <option value="grid">Grid</option>
                    <option value="dots">Dots</option>
                    <option value="lined">Lined</option>
                </select>
            </div>
            
            <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>

            <div class="flex items-center gap-1 shrink-0">
                <button id="zoom-out-btn" class="p-1 rounded text-slate-400 hover:text-white" title="Zoom Out"><i data-lucide="zoom-out" class="w-3.5 h-3.5"></i></button>
                <span id="zoom-level" class="text-[11px] text-slate-400 min-w-[32px] text-center">100%</span>
                <button id="zoom-in-btn" class="p-1 rounded text-slate-400 hover:text-white" title="Zoom In"><i data-lucide="zoom-in" class="w-3.5 h-3.5"></i></button>
                <button id="zoom-reset-btn" class="p-1 rounded text-slate-400 hover:text-white text-[10px] font-semibold" title="Reset Zoom View">1:1</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Canvas & DOM Container Nodes
        const canvasContainer = document.getElementById('canvas-container');
        const bgCanvas = document.getElementById('bg-layer');
        const bgCtx = bgCanvas.getContext('2d');
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');

        // UI Element Nodes
        const colorPicker = document.getElementById('wb-color');
        const sizePicker = document.getElementById('wb-size');
        const sizePreview = document.getElementById('size-preview');
        const gridSelect = document.getElementById('grid-pattern-select');
        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');
        const themeBtn = document.getElementById('theme-btn');
        const mobileThemeBtn = document.getElementById('m-theme-btn');
        
        // Assistive Drawer Mobile Control Nodes
        const assistiveBall = document.getElementById('assistive-ball');
        const mobileDrawer = document.getElementById('mobile-drawer');

        // State Machine Variables
        let activeTool = 'pen';
        let strokeColor = '#ffffff';
        let strokeWidth = 3;
        let activeGridPattern = 'none';
        let isDarkModeBoard = true; // Dark default mode
        let isDrawing = false;
        let strokePoints = [];

        // Pan/Zoom Viewport Engine Transform System
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let startPanX = 0, startPanY = 0;

        // Shape Geometry Capture Coordinates
        let shapeStartX = 0, shapeStartY = 0;

        // Vector History Engine State Stack
        let history = [];
        let historyStep = -1;
        const MAX_HISTORY = 30;

        // Mobile Multi-touch Gesture tracking
        let initialPinchDistance = null;
        let initialScale = 1;

        // Initialization
        function initCanvas() {
            const width = canvasContainer.clientWidth;
            const height = canvasContainer.clientHeight;

            bgCanvas.width = width;
            bgCanvas.height = height;
            canvas.width = width;
            canvas.height = height;

            redrawBackground();
            redrawMainCanvas();
        }

        // Layer 0 Renderer (Background Grid System)
        function redrawBackground() {
            bgCtx.save();
            bgCtx.setTransform(1, 0, 0, 1, 0, 0);
            bgCtx.fillStyle = isDarkModeBoard ? '#0f172a' : '#f8fafc';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            bgCtx.translate(panX, panY);
            bgCtx.scale(scale, scale);

            if (activeGridPattern !== 'none') {
                bgCtx.strokeStyle = isDarkModeBoard ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.08)';
                bgCtx.fillStyle = isDarkModeBoard ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.15)';
                bgCtx.lineWidth = 1 / scale;

                const step = 30;
                const width = canvas.width / scale + Math.abs(panX/scale);
                const height = canvas.height / scale + Math.abs(panY/scale);
                const startX = -panX / scale;
                const startY = -panY / scale;

                if (activeGridPattern === 'grid') {
                    for (let x = startX - (startX % step); x < width; x += step) {
                        bgCtx.beginPath(); bgCtx.moveTo(x, startY); bgCtx.lineTo(x, height); bgCtx.stroke();
                    }
                    for (let y = startY - (startY % step); y < height; y += step) {
                        bgCtx.beginPath(); bgCtx.moveTo(startX, y); bgCtx.lineTo(width, y); bgCtx.stroke();
                    }
                } else if (activeGridPattern === 'lined') {
                    for (let y = startY - (startY % step); y < height; y += step) {
                        bgCtx.beginPath(); bgCtx.moveTo(startX, y); bgCtx.lineTo(width, y); bgCtx.stroke();
                    }
                } else if (activeGridPattern === 'dots') {
                    for (let x = startX - (startX % step); x < width; x += step) {
                        for (let y = startY - (startY % step); y < height; y += step) {
                            bgCtx.beginPath(); bgCtx.arc(x, y, 1.2 / scale, 0, Math.PI * 2); bgCtx.fill();
                        }
                    }
                }
            }
            bgCtx.restore();
        }

        // Layer 1 Renderer (Drawing Layer Engine)
        function redrawMainCanvas() {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            if (historyStep >= 0 && history[historyStep]) {
                const img = history[historyStep];
                ctx.drawImage(img, 0, 0);
            }
            ctx.restore();
        }

        // Undo & Redo Canvas State System
        function saveHistoryState() {
            historyStep++;
            if (historyStep < history.length) {
                history = history.slice(0, historyStep);
            }
            
            const img = new Image();
            img.src = canvas.toDataURL();
            img.onload = () => {
                history.push(img);
                if (history.length > MAX_HISTORY) {
                    history.shift();
                    historyStep--;
                }
                updateUndoRedoUI();
            };
        }

        function updateUndoRedoUI() {
            undoBtn.disabled = historyStep <= 0;
            redoBtn.disabled = historyStep >= history.length - 1;
        }

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left - panX) / scale,
                y: (clientY - rect.top - panY) / scale
            };
        }

        // Pointer Event Handlers
        function handleStart(e) {
            // Check multi-touch gestures (Pinch Zoom / Pan)
            if (e.touches && e.touches.length === 2) {
                isDrawing = false;
                isPanning = true;
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialScale = scale;
                return;
            }

            const coords = getCanvasCoordinates(e);

            if (activeTool === 'pan' || e.button === 1 || e.spaceKey) {
                isPanning = true;
                startPanX = (e.touches ? e.touches[0].clientX : e.clientX) - panX;
                startPanY = (e.touches ? e.touches[0].clientY : e.clientY) - panY;
                return;
            }

            isDrawing = true;
            shapeStartX = coords.x;
            shapeStartY = coords.y;
            strokePoints = [coords];

            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
        }

        function handleMove(e) {
            // Handle Pinch Zoom & Dual Finger Pan on Mobile
            if (e.touches && e.touches.length === 2 && isPanning) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (initialPinchDistance) {
                    const factor = dist / initialPinchDistance;
                    setZoom(initialScale * factor);
                }
                return;
            }

            if (isPanning) {
                panX = (e.touches ? e.touches[0].clientX : e.clientX) - startPanX;
                panY = (e.touches ? e.touches[0].clientY : e.clientY) - startPanY;
                redrawBackground();
                redrawMainCanvas();
                return;
            }

            if (!isDrawing) return;
            const coords = getCanvasCoordinates(e);

            if (['pen', 'highlighter', 'eraser', 'auto-shape'].includes(activeTool)) {
                strokePoints.push(coords);
                ctx.lineWidth = activeTool === 'eraser' ? strokeWidth * 4 : strokeWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (activeTool === 'highlighter') {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = strokeColor + '40'; // Alpha transparency 25%
                } else if (activeTool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.strokeStyle = 'rgba(0,0,0,1)';
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = strokeColor;
                }

                ctx.lineTo(coords.x, coords.y);
                ctx.stroke();
            } else {
                // Vector Geometry Preview Rendering Phase
                redrawMainCanvas();
                ctx.save();
                ctx.translate(panX, panY);
                ctx.scale(scale, scale);
                ctx.lineWidth = strokeWidth;
                ctx.strokeStyle = strokeColor;
                ctx.fillStyle = strokeColor;
                ctx.globalCompositeOperation = 'source-over';
                
                drawShape(activeTool, shapeStartX, shapeStartY, coords.x, coords.y, ctx);
                ctx.restore();
            }
        }

        function handleEnd() {
            if (isPanning) { 
                isPanning = false; 
                initialPinchDistance = null;
                return; 
            }
            if (!isDrawing) return;
            isDrawing = false;
            ctx.restore();

            if (activeTool === 'auto-shape') {
                processSmartAutoShape(strokePoints);
            }

            saveHistoryState();
        }

        // Draw Pre-defined Vector Shapes
        function drawShape(tool, x1, y1, x2, y2, context) {
            context.beginPath();
            if (tool === 'line') {
                context.moveTo(x1, y1);
                context.lineTo(x2, y2);
                context.stroke();
            } else if (tool === 'arrow') {
                const headlen = 12 * (strokeWidth / 2);
                const angle = Math.atan2(y2 - y1, x2 - x1);
                context.moveTo(x1, y1);
                context.lineTo(x2, y2);
                context.stroke();
                
                context.beginPath();
                context.moveTo(x2, y2);
                context.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
                context.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
                context.closePath();
                context.fill();
            } else if (tool === 'rect') {
                context.strokeRect(x1, y1, x2 - x1, y2 - y1);
            } else if (tool === 'circle') {
                const r = Math.hypot(x2 - x1, y2 - y1);
                context.arc(x1, y1, r, 0, Math.PI * 2);
                context.stroke();
            } else if (tool === 'ellipse') {
                const rx = Math.abs(x2 - x1) / 2;
                const ry = Math.abs(y2 - y1) / 2;
                const cx = Math.min(x1, x2) + rx;
                const cy = Math.min(y1, y2) + ry;
                context.ellipse(cx, cy, rx || 1, ry || 1, 0, 0, Math.PI * 2);
                context.stroke();
            } else if (tool === 'triangle') {
                context.moveTo((x1 + x2) / 2, y1);
                context.lineTo(x1, y2);
                context.lineTo(x2, y2);
                context.closePath();
                context.stroke();
            } else if (tool === 'graph') {
                // 2D Coordinate Graph Axes
                const w = x2 - x1;
                const h = y2 - y1;
                const cx = x1 + w / 2;
                const cy = y1 + h / 2;

                // Main Axes
                context.moveTo(x1, cy); context.lineTo(x2, cy); // X-Axis
                context.moveTo(cx, y1); context.lineTo(cx, y2); // Y-Axis
                context.stroke();

                // Axis Arrows
                context.beginPath();
                // X Arrow
                context.moveTo(x2, cy); context.lineTo(x2 - 8, cy - 5); context.lineTo(x2 - 8, cy + 5);
                // Y Arrow
                context.moveTo(cx, y1); context.lineTo(cx - 5, y1 + 8); context.lineTo(cx + 5, y1 + 8);
                context.fill();
            }
        }

        // Smart Geometric Auto-Shape Detection Engine
        function processSmartAutoShape(pts) {
            if (pts.length < 6) return;
            const first = pts[0];
            const last = pts[pts.length - 1];
            const isClosed = Math.hypot(last.x - first.x, last.y - first.y) < 45;

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            pts.forEach(p => {
                minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
            });

            const w = maxX - minX;
            const h = maxY - minY;

            redrawMainCanvas();
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);
            ctx.lineWidth = strokeWidth;
            ctx.strokeStyle = strokeColor;
            ctx.globalCompositeOperation = 'source-over';

            if (isClosed) {
                const ratio = w / h;
                if (ratio >= 0.8 && ratio <= 1.2) {
                    // Circle or Square
                    ctx.beginPath();
                    ctx.arc(minX + w / 2, minY + h / 2, (w + h) / 4, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    // Ellipse or Rectangle
                    ctx.beginPath();
                    ctx.ellipse(minX + w/2, minY + h/2, w/2, h/2, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
            } else {
                // Straight line replacement
                ctx.beginPath();
                ctx.moveTo(first.x, first.y);
                ctx.lineTo(last.x, last.y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // Event Listeners
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', (e) => { handleStart(e); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { handleMove(e); }, {passive: false});
        window.addEventListener('touchend', handleEnd);

        // Tool Selection Handlers
        const toolsList = ['pen', 'highlighter', 'auto-shape', 'eraser', 'line', 'arrow', 'rect', 'circle', 'ellipse', 'triangle', 'graph', 'pan'];
        
        function setTool(toolName) {
            activeTool = toolName;
            
            // Desktop active state UI update
            toolsList.forEach(t => {
                const b = document.getElementById(`tool-${t}`);
                if (b) {
                    if (t === toolName) b.classList.add('active-tool');
                    else b.classList.remove('active-tool');
                }
            });

            // Mobile Active Tool UI update
            document.querySelectorAll('.m-tool-btn').forEach(btn => {
                if (btn.getAttribute('data-tool') === toolName) {
                    btn.classList.remove('bg-slate-800', 'text-slate-300');
                    btn.classList.add('bg-indigo-600', 'text-white');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white');
                    btn.classList.add('bg-slate-800', 'text-slate-300');
                }
            });
        }

        toolsList.forEach(t => {
            const btn = document.getElementById(`tool-${t}`);
            if (btn) btn.addEventListener('click', () => setTool(t));
        });

        // Mobile drawer buttons binding
        document.querySelectorAll('.m-tool-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tool = btn.getAttribute('data-tool');
                setTool(tool);
                toggleMobileDrawer(false);
            });
        });

        // Mobile Drawer Toggle logic
        function toggleMobileDrawer(forceState) {
            const isClosed = mobileDrawer.classList.contains('drawer-closed');
            const shouldOpen = forceState !== undefined ? forceState : isClosed;

            if (shouldOpen) {
                mobileDrawer.classList.remove('drawer-closed');
                mobileDrawer.classList.add('drawer-open');
            } else {
                mobileDrawer.classList.remove('drawer-open');
                mobileDrawer.classList.add('drawer-closed');
            }
        }

        assistiveBall.addEventListener('click', () => toggleMobileDrawer());

        // Theme Toggle Engine
        function toggleTheme() {
            isDarkModeBoard = !isDarkModeBoard;
            const icon = isDarkModeBoard ? 'sun' : 'moon';
            themeBtn.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i>`;
            mobileThemeBtn.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i>`;
            
            // Adjust default palette stroke color for usability visibility
            if (!isDarkModeBoard && strokeColor === '#ffffff') {
                strokeColor = '#000000';
                colorPicker.value = '#000000';
            } else if (isDarkModeBoard && strokeColor === '#000000') {
                strokeColor = '#ffffff';
                colorPicker.value = '#ffffff';
            }

            lucide.createIcons();
            redrawBackground();
        }

        themeBtn.addEventListener('click', toggleTheme);
        mobileThemeBtn.addEventListener('click', toggleTheme);

        // Zoom System Settings
        function setZoom(newScale) {
            scale = Math.min(Math.max(0.2, newScale), 5);
            document.getElementById('zoom-level').textContent = `${Math.round(scale * 100)}%`;
            redrawBackground();
            redrawMainCanvas();
        }

        document.getElementById('zoom-in-btn').addEventListener('click', () => setZoom(scale * 1.15));
        document.getElementById('zoom-out-btn').addEventListener('click', () => setZoom(scale / 1.15));
        document.getElementById('zoom-reset-btn').addEventListener('click', () => { panX = 0; panY = 0; setZoom(1); });

        // Color & Stroke Adjustments
        colorPicker.addEventListener('input', (e) => strokeColor = e.target.value);
        document.querySelectorAll('.color-preset').forEach(p => {
            p.addEventListener('click', () => {
                strokeColor = p.getAttribute('data-color');
                colorPicker.value = strokeColor;
            });
        });

        sizePicker.addEventListener('input', (e) => {
            strokeWidth = e.target.value;
            sizePreview.textContent = `${strokeWidth}px`;
        });

        gridSelect.addEventListener('change', (e) => {
            activeGridPattern = e.target.value;
            redrawBackground();
        });

        // Canvas Action Clear / Export / Undo Handlers
        undoBtn.addEventListener('click', () => {
            if (historyStep > 0) { 
                historyStep--; 
                redrawMainCanvas(); 
                updateUndoRedoUI(); 
            }
        });

        redoBtn.addEventListener('click', () => {
            if (historyStep < history.length - 1) { 
                historyStep++; 
                redrawMainCanvas(); 
                updateUndoRedoUI(); 
            }
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveHistoryState();
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            // Render composite offscreen buffer
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width;
            exportCanvas.height = canvas.height;
            const expCtx = exportCanvas.getContext('2d');

            // Copy background layer
            expCtx.drawImage(bgCanvas, 0, 0);
            // Copy foreground drawings
            expCtx.drawImage(canvas, 0, 0);

            const a = document.createElement('a');
            a.download = `sprk-board-${Date.now()}.png`;
            a.href = exportCanvas.toDataURL('image/png');
            a.click();
        });

        // Global Keyboard Shortcut Manager
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') { e.preventDefault(); undoBtn.click(); }
                if (e.key === 'y') { e.preventDefault(); redoBtn.click(); }
            } else {
                if (e.key === 'p' || e.key === 'P') setTool('pen');
                if (e.key === 'e' || e.key === 'E') setTool('eraser');
                if (e.key === 'h' || e.key === 'H') setTool('pan');
                if (e.key === 'Delete') document.getElementById('clear-btn').click();
            }
        });

        window.addEventListener('resize', initCanvas);
        
        // Startup Workflow Initialization
        initCanvas();
        saveHistoryState();
    </script>
</body>
</html>
