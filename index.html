<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRK-Web</title>
    <link rel="icon" href="https://sprk-web.github.io/favicon.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="https://sprk-web.github.io/favicon.png">
    <link rel="shortcut icon" href="https://sprk-web.github.io/favicon.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .brand-logo-container {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .brand-main {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7f00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            position: relative;
        }

        .brand-sub::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #00f2fe;
            border-radius: 50%;
            top: 25%;
            right: -10px;
            box-shadow: 0 0 8px #00f2fe, 0 0 15px #00f2fe;
            animation: pulse 2s infinite alternate;
        }

        .logo-underline {
            width: 25px;
            height: 3px;
            background: linear-gradient(90deg, #00f2fe, #7f00ff);
            margin-top: 2px;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0, 242, 254, 0.4);
            transition: width 0.4s ease;
        }

        .brand-logo-container:hover .logo-underline {
            width: 100%;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50 transition-colors duration-300 min-h-screen flex flex-col">

    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 backdrop-blur sticky top-0 z-50 w-full">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center w-full">
            
            <div class="brand-logo-container">
                <div class="flex items-center text-xl font-black uppercase tracking-wider select-none">
                    <span class="brand-main">Sprk</span>
                    <span class="brand-sub text-slate-800 dark:text-white font-light ml-0.5">-Web</span>
                </div>
                <div class="logo-underline"></div>
            </div>

            <button id="theme-toggle" class="p-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors duration-200" aria-label="Toggle theme">
                <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <main id="main-content" class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 flex flex-col justify-center items-center">
        
        <div id="loading-state" class="flex flex-col items-center gap-4">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="text-slate-500 dark:text-slate-400 font-medium">Setting up best experience for you...</p>
        </div>

        <div id="error-state" class="hidden text-center max-w-md p-6 bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-900/50 rounded-2xl">
            <i data-lucide="alert-circle" class="w-12 h-12 text-red-500 mx-auto mb-4"></i>
            <h2 class="text-xl font-semibold text-red-800 dark:text-red-400 mb-2">Failed to Load Content</h2>
            <p id="error-message" class="text-sm text-red-600 dark:text-red-400/80 mb-4">No valid path parameter found in URL.</p>
        </div>

        <div id="content" class="hidden w-full flex flex-col gap-4 justify-start items-center">
            <div class="w-full flex flex-col gap-2">
                <input type="text" id="search-filter" placeholder="Search for content..." class="w-full p-3 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div id="file-links" class="w-full flex flex-col gap-4">
                <div id="section-site" class="hidden flex flex-col gap-3 w-full">
                    <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-200 flex items-center gap-2">
                        <i data-lucide="globe" class="w-5 h-5 text-indigo-500"></i> Sites
                    </h3>
                    <div id="file-links-site" class="w-full"></div>
                </div>
                
                <div id="section-pdf" class="hidden flex flex-col gap-3 w-full">
                    <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-200 flex items-center gap-2">
                        <i data-lucide="file-text" class="w-5 h-5 text-red-500"></i> PDFs
                    </h3>
                    <div id="file-links-pdf" class="w-full"></div>
                </div>
                
                <div id="section-images" class="hidden flex flex-col gap-3 w-full">
                    <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-200 flex items-center gap-2">
                        <i data-lucide="image" class="w-5 h-5 text-emerald-500"></i> Images
                    </h3>
                    <div id="file-links-images" class="w-full"></div>
                </div>
            </div>
            
            <div id="no-results" class="hidden text-center py-8 text-slate-400 w-full">
                <i data-lucide="folder-open" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                <p>No matching resources found.</p>
            </div>
        </div>

    </main>

    <script>
        let resourceData = [];

        function random(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        };

        function fetchData() {
            const url = 'https://sprk-web.github.io/files/resources.json';
            fetch(url).then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            }).then(data => {
                resourceData = data;
                renderResources();
            }).catch(error => {
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('main-content').classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
                document.getElementById('error-message').textContent = 'Failed to fetch resources. Please try again later.';
            });
        };

        function renderResources(filter = '') {
        const types = [...new Set(resourceData.map(r => r.type.toLowerCase()))];
    types.forEach(type => {
        const el = document.getElementById(`file-links-${type}`);
        if (el) el.innerHTML = '';
    });
        const sections = ["site", "pdf", "images"];
        for (const section of sections) {
            const sectionEl = document.getElementById(`section-${section}`);
            if (sectionEl) sectionEl.classList.add('hidden');
        }

        for (let i = 0; i < resourceData.length; i++) {
        const resource = resourceData[i];
        
        if (filter && 
            !resource.name.toLowerCase().includes(filter.toLowerCase()) && 
            !resource.type.toLowerCase().includes(filter.toLowerCase())) {
            continue;
        }

        const type = resource.type.toUpperCase();
        const name = resource.name;
        const path = resource.path;
        
        const container = document.createElement('div');
        container.className = 'file-card w-full p-5 bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800/80 rounded-2xl flex flex-row items-center justify-between gap-4 shadow-sm hover:shadow-md hover:border-blue-500/30 dark:hover:border-blue-500/30 transition-all duration-300 group';
        
        const textContainer = document.createElement('div');
        textContainer.className = 'flex flex-col gap-1 w-full min-w-0';
        
        const typeTag = document.createElement('span');
        typeTag.textContent = type;
        typeTag.className = 'text-[10px] font-bold tracking-wider text-blue-600 dark:text-blue-400 uppercase bg-blue-50 dark:bg-blue-950/50 px-2 py-0.5 rounded-md w-fit';
        
        const title = document.createElement('h3');
        title.textContent = name;
        title.className = 'file-name text-base font-semibold text-slate-800 dark:text-slate-100 line-clamp-1';
        
        textContainer.appendChild(typeTag);
        textContainer.appendChild(title);
        
        const button = document.createElement('a');
        button.href = path;
        button.className = 'btn-action px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-800/60 rounded-xl border border-slate-200/60 dark:border-slate-700/50 hover:bg-blue-600 hover:text-white dark:hover:bg-blue-600 dark:hover:text-white hover:border-transparent transition-all duration-200 shrink-0 shadow-sm';
        button.textContent = 'View';
        
        container.appendChild(textContainer);
        container.appendChild(button);

        const targetList = document.getElementById(`file-links-${type.toLowerCase()}`);
        if (targetList) {
            targetList.appendChild(container);
            targetList.classList.remove('hidden');
        }
        
        const targetSection = document.getElementById(`section-${type.toLowerCase()}`);
        if (targetSection) {
            targetSection.classList.remove('hidden');
        }
    }
}

        function init() {
        fetchData();

        const searchInput = document.getElementById('search-filter');
        searchInput.addEventListener('input', (e) => {
            renderResources(e.target.value);
        });

        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('main-content').classList.remove('justify-center');
        document.getElementById('main-content').classList.add('justify-start');
        document.getElementById('content').classList.remove('hidden');
};

        window.addEventListener('DOMContentLoaded', () => {
            init();
            lucide.createIcons();
        }, { once: true });
    </script>
</body>
</html>
