<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Repository</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007aff;
            --primary-hover: #0056b3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #111;
        }

        p {
            color: #666;
            margin: 0;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background: var(--card-bg);
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .link-info {
            display: flex;
            flex-direction: column;
        }

        .link-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #111;
        }

        .link-type {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-view {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .link-card:hover .btn-view {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Resource Library</h1>
            <p>Access and download your study materials below.</p>
        </header>

        <main class="links-list">
            <a href="https://sprk-web.github.io/files/Ch_1_PYQs.pdf" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-info">
                    <span class="link-title">Chapter 1 Previous Year Questions (PYQs)</span>
                    <span class="link-type">PDF Document</span>
                </div>
                <span class="btn-view">Open</span>
            </a>
            
            </main>
    </div>

</body>
</html>
