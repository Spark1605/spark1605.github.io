<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRK-Web</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50 transition-colors duration-300 min-h-screen flex flex-col">

    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 backdrop-blur sticky top-0 z-50 w-full">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center w-full">
            <div class="flex items-center gap-2">
                <i data-lucide="brain-circuit" class="w-6 h-6 text-indigo-600 dark:text-indigo-400"></i>
                <span class="font-bold text-lg tracking-tight">SPRK-<span class="text-indigo-600 dark:text-indigo-400">Web</span></span>
            </div>
            <button id="theme-toggle" class="p-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors duration-200" aria-label="Toggle theme">
                <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <main id="main-content" class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 flex flex-col justify-center items-center">
        
        <div id="loading-state" class="flex flex-col items-center gap-4">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="text-slate-500 dark:text-slate-400 font-medium">Setting up best experience for you...</p>
        </div>

        <div id="error-state" class="hidden text-center max-w-md p-6 bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-900/50 rounded-2xl">
            <i data-lucide="alert-circle" class="w-12 h-12 text-red-500 mx-auto mb-4"></i>
            <h2 class="text-xl font-semibold text-red-800 dark:text-red-400 mb-2">Failed to Load Content</h2>
            <p id="error-message" class="text-sm text-red-600 dark:text-red-400/80 mb-4">No valid path parameter found in URL.</p>
        </div>

        <div id="content" class="hidden w-full flex flex-col gap-4 justify-start items-center">
            <div class="w-full flex flex-col gap-2">
                <input type="text" id="search-filter" placeholder="Search for content..." class="w-full p-3 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div id="file-links" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 w-full">
            </div>
        </div>

    </main>

    <script>
        // Global storage for data to allow filtering without refetching
        let resourceData = [];

        function random(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        };

        function populateFileLinks(data, searchTerm = '') {
            const fileLinksContainer = document.getElementById('file-links');
            fileLinksContainer.innerHTML = '';

            const filteredData = data.filter(item => item.name.toLowerCase().includes(searchTerm.toLowerCase()));

            if (filteredData.length === 0) {
                fileLinksContainer.innerHTML = '<p class="text-slate-500 dark:text-slate-400 text-center col-span-full py-8">No files found matching your search.</p>';
                return;
            }

            filteredData.forEach(item => {
                const linkElement = document.createElement('a');
                linkElement.href = item.url;
                linkElement.target = '_blank';
                linkElement.rel = 'noopener noreferrer';
                linkElement.className = 'block p-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm hover:shadow-md hover:border-indigo-500 dark:hover:border-indigo-400 transition-all duration-200';

                const nameElement = document.createElement('h3');
                nameElement.textContent = item.name;
                nameElement.className = 'font-semibold text-slate-900 dark:text-slate-50 mb-1';

                const descElement = document.createElement('p');
                descElement.textContent = item.description || 'No description available.';
                descElement.className = 'text-sm text-slate-500 dark:text-slate-400';

                linkElement.appendChild(nameElement);
                linkElement.appendChild(descElement);
                fileLinksContainer.appendChild(linkElement);
            });
        };

        function fetchData() {
            const url = 'https://sprk-web.github.io/files/resources.json';
            return fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    resourceData = data;
                    populateFileLinks(resourceData);
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('content').classList.add('hidden');
                    document.getElementById('error-state').classList.remove('hidden');
                    document.getElementById('error-message').textContent = 'Failed to fetch data. Please try again later.';
                });
        };

        function setupTheme() {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const htmlElement = document.documentElement;
            
            // Check system preference or saved storage if desired, defaulting here to light
            themeToggleBtn.addEventListener('click', () => {
                if (htmlElement.classList.contains('dark')) {
                    htmlElement.classList.remove('dark');
                    htmlElement.classList.add('light');
                    updateThemeIcon('moon');
                } else {
                    htmlElement.classList.remove('light');
                    htmlElement.classList.add('dark');
                    updateThemeIcon('sun');
                }
            });
        }

        function updateThemeIcon(iconName) {
            const iconContainer = document.getElementById('theme-toggle');
            iconContainer.innerHTML = `<i id="theme-icon" data-lucide="${iconName}" class="w-4 h-4"></i>`;
            lucide.createIcons();
        }

        function setupSearch() {
            const searchInput = document.getElementById('search-filter');
            searchInput.addEventListener('input', (e) => {
                populateFileLinks(resourceData, e.target.value);
            });
        }

        function init() {
    Promise.all([
        fetchData(),
        new Promise(resolve => setTimeout(resolve, random(500, 1500)))
    ]).then(() => {
        // Remove or modify the breaking line so the UI actually switches over
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('main-content').classList.remove('justify-center');
        document.getElementById('main-content').classList.add('justify-start');
        document.getElementById('content').classList.remove('hidden');
    });
};

        window.addEventListener('DOMContentLoaded', () => {
            init();
            setupTheme();
            setupSearch();
            lucide.createIcons();
        }, { once: true });
    </script>
</body>
</html>
